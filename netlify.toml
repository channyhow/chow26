[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.23.2"

# Preserve useful legacy Chow Studio URLs and backlinks.
[[redirects]]
  from = "/work"
  to = "/projets"
  status = 301
  force = true

[[redirects]]
  from = "/work/*"
  to = "/projets"
  status = 301
  force = true

[[redirects]]
  from = "/comprendre"
  to = "/studio"
  status = 301
  force = true

[[redirects]]
  from = "/comprendre/*"
  to = "/studio"
  status = 301
  force = true

[[redirects]]
  from = "/approche"
  to = "/studio"
  status = 301
  force = true

[[redirects]]
  from = "/approche/*"
  to = "/studio"
  status = 301
  force = true

# Unknown URLs must return a real 404 rather than an indexable SPA shell.
[[redirects]]
  from = "/*"
  to = "/404/index.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'self' https://tally.so; img-src 'self' data:; manifest-src 'self'; object-src 'none'; script-src 'self' https://tally.so; style-src 'self' 'unsafe-inline'; upgrade-insecure-requests"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Permissions-Policy = "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), publickey-credentials-get=(), usb=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-Permitted-Cross-Domain-Policies = "none"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/offline.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/system"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/branding"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/liens"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/404"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
