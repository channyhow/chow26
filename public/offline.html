<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F6F5F3" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Hors connexion | Atmosphere Studio</title>
    <style>
      :root {
        color: #222224;
        background: #f6f5f3;
        font-family: Poppins, Arial, sans-serif;
      }

      body {
        display: grid;
        min-height: 100svh;
        margin: 0;
        padding: clamp(1.5rem, 5vw, 5rem);
        box-sizing: border-box;
        place-items: center;
      }

      main {
        width: min(100%, 42rem);
      }

      h1 {
        margin: 0 0 1rem;
        font-family: "Noto Serif Display", Georgia, serif;
        font-size: clamp(2.5rem, 8vw, 6rem);
        font-weight: 400;
        line-height: 0.95;
      }

      p {
        max-width: 34rem;
        margin: 0;
        line-height: 1.6;
      }

      a {
        display: inline-block;
        margin-top: 2rem;
        color: inherit;
        text-underline-offset: 0.25em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hors connexion.</h1>
      <p>Cette page n’est pas encore disponible hors ligne. Vérifiez votre connexion, puis réessayez.</p>
      <a href="/">Revenir à l’accueil</a>
    </main>
  </body>
</html>
